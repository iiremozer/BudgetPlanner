<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Our Savings Book</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #fffcf7;
        color: #1d2420;
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #121518; color: #e8ebe9; }
        .btn { background: #a8d5c2; color: #10151a; }
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { margin: 0 0 20px; opacity: 0.75; max-width: 28ch; }
      .btn {
        appearance: none;
        border: none;
        border-radius: 12px;
        padding: 13px 22px;
        font-size: 16px;
        font-weight: 600;
        background: #1e3a34;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>No connection</h1>
      <p>Your book is safe on this phone. Reconnect and open it again.</p>
      <button class="btn" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
