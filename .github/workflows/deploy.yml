name: Yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Derle
    runs-on: ubuntu-latest

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Testleri koş
        run: npm test

      - name: Derle
        run: npm run build

      - name: Pages ayarlarını al
        uses: actions/configure-pages@v5

      - name: Çıktıyı yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Yayına al
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Pages'e gönder
        id: deployment
        uses: actions/deploy-pages@v4
